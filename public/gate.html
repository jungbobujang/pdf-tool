<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>PDF 작업실 · 스쿨에서 열어 주세요</title>
  <meta name="app-version" content="">
  <meta name="theme-color" content="#141B2E">
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/vendor/pretendard/pretendardvariable.min.css">
  <link rel="stylesheet" href="/gate.css">
  <script src="/gate.js" defer></script>
</head>
<body class="gate">
  <main class="gate-card" id="gate" data-school="__SCHOOL_URL__">
    <img class="gate-logo" src="/icons/logo.svg" alt="" width="56" height="56">
    <p class="gate-name">PDF 작업실</p>
    <!-- 입장권을 확인하는 동안 -->
    <div id="gate-checking" hidden>
      <h1 class="gate-title">여는 중이에요…</h1>
      <p class="gate-text">스쿨에서 받은 입장권을 확인하고 있어요.</p>
    </div>
    <!-- 주소만 알고 왔거나 입장권이 없을 때 -->
    <div id="gate-plain">
      <h1 class="gate-title" id="gate-title">스쿨에서 열어 주세요</h1>
      <p class="gate-text" id="gate-text">스쿨 선생님 전용 도구예요. [스쿨에서 열기]를 누르면 로그인 뒤 바로 이 화면으로 돌아와요.</p>
      <p class="gate-text gate-icon-note" id="gate-icon" hidden>바탕화면 아이콘으로는 바로 열 수 없어요. [스쿨에서 열기]를 누르면 로그인 뒤 바로 이 화면으로 돌아와요. 스쿨을 설치했다면 스쿨 아이콘을 오른쪽 클릭해 PDF 작업실을 열 수도 있어요. 이 아이콘은 지워도 돼요.</p>
      <p class="gate-error" id="gate-error" role="alert" hidden></p>
    </div>
    <!-- 스쿨의 /go/pdf: 로그인 · 잠금을 거쳐 입장권을 받아 이 주소의 # 뒤에 붙여 돌려보낸다 -->
    <a class="gate-btn" id="gate-school" href="__SCHOOL_URL__/go/pdf">스쿨에서 열기</a>
    <p class="gate-foot">파일은 언제나 이 컴퓨터 밖으로 나가지 않아요.</p>
  </main>
</body>
</html>
